          \ ] 长度约 150 词\\n- [ ] 纯英文，无标题、编号、注释、中文、闲聊\\n- [ ] 5W1H 基本交代清楚\\n- [ ] 无广告、链接、HTML\
          \ 残留\\n- [ ] 自行补全的部分逻辑自洽，且未编造具体实体与精确数字\\n- [ ] 可直接交给下游扩写节点\"\n        }\n\
          \    }else if(arg==2){\n        return{\n            \"result\":\"---\\\
          nname: cet4-news-brief-three\\ndescription: 把内置爬虫抓回的三篇新闻原始数据，分别整理成三段各约 150\
