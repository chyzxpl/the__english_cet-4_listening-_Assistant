          n\\n---\\n\\n## 何事 · W1 事件经过型\\n\\n真题原型：\\n\\n- What happened at a construction\
          \ site in Brooklyn on Tuesday?（Q1）\\n- What happened in Scotland last Wednesday?（Q2）\\\
          n- What happened to the tour boat sailing off the Nicaraguan coast?（Q5）\\\
          n- What happened to the little girl according to the news report?（Q7）\\\
