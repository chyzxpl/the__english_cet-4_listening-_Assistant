          \ \\n-  What caused / What has caused + 现象? \\n-  What accounts for + 现象?\
          \ \\n-  What is the purpose of + 事物?  /  For what purpose did + 主体 + 动作?\
          \ \\n-  What motivated + 人物 + to + 动作? \\n\\n## 何人（Who / 引语转述 / 关于某人）\\\
          n\\n真题原型：\\n\\n- What does the news report say about the waiter?（Q1）\\n-\
