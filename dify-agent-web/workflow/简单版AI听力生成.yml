          n\\n-  What happened to + 人物/事物 (+ 时间)? \\n-  What has happened + since\
          \ + 时间点? \\n-  What does the news report say happened finally? \\n-  What\
          \ will happen + when + 条件? \\n\\n要点：Q7 是收尾题，W1 常以「最终结果」形态出现，答案落在原文最后一段。\\\
          n\\n---\\n\\n## 何事 · W2 信息获知型\\n\\n真题原型（Q5）：\\n\\n- What is the news report\
          \ mainly about?（多次出现）\\n- What do we learn about the first flight of the\
          \ Airlander 10?\\n- What do we learn from the news report about the Japanese\
