          n\\n## 执行步骤\\n\\n1. **通读** —— 读完全部爬虫返回内容（标题、正文片段、时间、来源、可能残缺的 HTML 文本、乱码）。\\\
          n2. **清洗** —— 剔除广告、导航、版权声明、\\\"Read more\\\"、重复段落、HTML 标签与实体残留、非目标语言的乱码。\\\
          n3. **抽骨架** —— 判定 Who / What / When / Where / Why / How。爬不到或缺损的项记为未知。\\\
          n4. **写摘要** —— 按下方要求组织语言。\\n5. **自检并输出**。\\n\\n## 摘要要求\\n\\n- **长度约 150\
          \ 词**，140–165 之间均可。\\n- **语言**：英文。**任何情况下不得出现中文、解释语或对话语气。**\\n- **时态**：以一般过去时为主；涉及后续安排可用将来时。\\\
          n- **内容完整**：把这条新闻讲清楚——谁、发生了什么、何时、何地、为什么、结果如何。\\n- **句式**：一句话讲清一件事，句子简短可读，避免嵌套从句。\\\
          n- **爬虫数据不精准时可以自行补充内容**，但必须遵守：\\n  - 只补与已知信息方向一致的常识性背景与逻辑衔接；\\n  - 补完之后通篇要**逻辑自洽**，不留破绽；\\\
