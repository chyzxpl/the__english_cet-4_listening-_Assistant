    - data:
        code: "import random\n\n# ========== 第 3 层基础数据：类别 -> 网址池（池内等权重） ==========\n\
          _URL_TRAFFIC = [\n    \"https://nypost.com/tag/freak-accidents/\",\n   \
          \ \"https://apnews.com/hub/accidents\",\n]\n_URL_ANIMAL = [\n    \"https://www.bbc.com/news/topics/ce2gz91g2jmt\"\
          ,\n    \"https://www.theguardian.com/world/animals\",\n]\n_URL_NATURE =\
          \ [\n    \"https://www.bbc.com/future-planet\",\n    \"https://www.theguardian.com/us/environment\"\
          ,\n]\n\nURL_POOLS = {\n    \"交通事故\": _URL_TRAFFIC,          # 交通类（事故）\n\
          \    \"交通\":     _URL_TRAFFIC,          # 交通类\n    \"动物\":     _URL_ANIMAL,\
          \           # 动物类\n    \"自然\":     _URL_NATURE,           # 自然/环境类\n   \
          \ \"环境\":     _URL_NATURE,           # 自然/环境类\n    \"轶事\": [\n        \"\
          https://apnews.com/oddities\",\n        \"https://www.npr.org/sections/strange-news/\"\
          ,\n        \"https://www.usnews.com/news/offbeat\",\n    ],\n    \"科技\"\
          : [\n        \"https://www.reuters.com/technology/\",\n        \"https://www.bbc.com/technology\"\
          ,\n    ],\n    \"健康\": [\n        \"https://www.bbc.com/health\",\n    \
          \    \"https://www.usnews.com/topics/subjects/exercise\",\n    ],\n}\n\n\
          # ========== 第 2 层：News 任务 -> (类别, 权重%) ==========\nNEWS_TREE = {\n    1:\
          \ [(\"交通事故\", 30), (\"交通\", 25), (\"动物\", 25), (\"自然\", 20)],  # News-1\n\
          \    2: [(\"动物\", 30), (\"轶事\", 30), (\"自然\", 20), (\"环境\", 20)],      #\
          \ News-2\n    3: [(\"科技\", 50), (\"健康\", 30), (\"自然\", 20)],           \
          \         # News-3\n}\n\n\ndef _pick_url(news_id: int) -> str:\n    \"\"\
          \"第 2 层（类别加权）+ 第 3 层（网址等权），返回一个网址字符串\"\"\"\n    categories, weights = zip(*NEWS_TREE[news_id])\n\
          \    category = random.choices(categories, weights=weights, k=1)[0]  # 第\
          \ 2 层\n    return random.choice(URL_POOLS[category])                   \
          \    # 第 3 层\n\n\ndef main(correspond_code: int):\n    \"\"\"第 1 层（输入分支）+\
          \ 第 4 层（结果组装）\"\"\"\n    code = int(correspond_code)\n\n    # 未生成的任务返回占位字符串\
          \ \"NULL\"\n    result_1, result_2, result_3 = \" \", \" \", \" \"\n\n \
          \   if code == 1:            # 只执行 News-1（short report）\n        result_1\
          \ = _pick_url(1)\n    elif code == 2:          # 只执行 News-3（long report）\n\
          \        result_3 = _pick_url(3)\n    elif code == 3:          # 全部生成 News-1\
          \ / News-2 / News-3\n        result_1 = _pick_url(1)\n        result_2 =\
          \ _pick_url(2)\n        result_3 = _pick_url(3)\n    else:\n        raise\
