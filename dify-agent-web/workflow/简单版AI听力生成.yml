          \ parents?\\n\\n通用模板：\\n\\n-  What did + 主体 + do/decide/attempt/offer to\
          \ do? \\n-  What is/are + 主体 + planning/trying/aiming to do? \\n-  What\
          \ were + 群体 + advised/supposed/required to do? \\n-  What does the report\
          \ say + 主体 + is going to do? \\n-  What measure/plan + has been + planned/proposed?\
          \ \\n-  What do + 研究/实验 + show/find about + X? \\n\\n要点：答案是一个动作、举措、计划或研究结论。干扰项常为主体错位或程度偏移（计划说成已完成）。\\\
          n\\n---\\n\\n## 何人（Who / 某人说了什么 / 关于某人的信息）\\n\\n真题原型（Q5）：\\n\\n- What does\
