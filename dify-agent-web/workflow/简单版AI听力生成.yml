          n- **时态**：以一般过去时为主；涉及后续安排可用将来时。\\n- **内容完整**：把这条新闻讲清楚——谁、发生了什么、何时、何地、为什么、结果如何。\\\
          n- **句式**：一句话讲清一件事，句子简短可读，避免嵌套从句。\\n- **爬虫数据不精准时可以自行补充内容**，但必须遵守：\\n  -\
          \ 只补与已知信息方向一致的常识性背景与逻辑衔接；\\n  - 补完之后各段要**逻辑自洽**，不留破绽；\\n  - **不得凭空捏造**具体人名、机构名、精确数字、日期与直接引语；需要这些而爬虫没给时，改用笼统表述（`local\
          \ officials`、`several people`、`a nearby town`）。\\n- **词汇难度适中**即可（下游会做四级降级），不要刻意用生僻词，也不要为了凑数堆形容词。\\\
          n- **不要出现**来源链接、URL、记者署名、抓取时间戳。\\n- **三段内容互不交叉**：不得互相引用、共用同一事件或写成连续剧情。\\\
          n\\n## 输出格式\\n\\n输出**一个纯文本字符串**，三段之间用**单独一行 `|||`** 分隔，除此之外全文不再出现该符号：\"\n\
