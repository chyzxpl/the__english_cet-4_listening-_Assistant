          n---\\n\\n# 摘要字符串 → CET-4 听力 News Report One\\n\\n## 输入输出\\n\\n- **输入**：一段英文\
          \ description 文本（约 150 词），由上游 Agent 整理爬虫数据后给出。**其中的英文叙述部分即唯一事实来源**，不假设存在标题、正文或任何其他字段。\\\
          n- **输出**：**一个纯英文字符串**，只有新闻正文，直通 TTS。\\n\\n## 执行步骤\\n\\n1. **净化** —— 上游\
          \ Agent 可能夹带非正文内容，必须先剔除再使用：中文说明与对话（\\\"好的，这是摘要\\\"、\\\"以下是整理结果\\\"）、解释语、免责声明、Markdown\
          \ 标记、`SOURCE:` 之类的字段名、代码块围栏。**只保留其中的英文叙述性句子**。净化后若不足以判断核心事件，如实说明无法生成，不得凭空创作。\\\
          n2. **通读** —— 把净化后的文本当作新闻摘要读完。若过短（不足约 15 词）或残缺到无法判断核心事件，如实说明无法生成。\\n3. **清洗**\
          \ —— 去除 HTML 标签；实体解码（`&amp;`→`&`、`&#39;`→`'`、`&quot;`→`\\\"`）；删掉来源尾巴、订阅引导、`Read\
          \ more` 等噪声；若末句被截断，只保留到最后一个完整句，残缺部分**丢弃，不得脑补**。\\n4. **抽骨架** —— 从清洗后文本提取\
          \ Who / What / When / Where / Why / How。缺项记为未知。\\n5. **扩写** —— 倒金字塔结构：\\\
          n   - 首句即核心事件，尽量把已知 5W1H 压进去；\\n   - 第二段补细节、引语或数据，**只能来自净化后的输入文本**；\\n \
          \  - 词数仍不足时，补**无实体指向的通用新闻表述**（如 `Officials said the investigation is continuing.`）。\\\
          n6. **校准** —— 按口径数字数，不达标就继续删或补，直到进入区间。\\n7. **输出** —— 只输出正文，一个字都不多。\\n\\\
          n## 目标词数（硬指标）\\n\\n- **News Report One：165 词，允许 ±5（即 160–170）。超出必须重写，宁可略少不可超。**\\\
          n\\n统计口径：空格分词；连字符词算 1 个；`1.5 million` 算 2 个；专名按空格分词；标点不计。\\n\\n## 用词与句式\\\
          n\\n- 词汇限四级大纲（约 4500 词）。常用降级：`commence→begin`、`utilize→use`、`implement→carry\
          \ out`、`significant→big/major`、`approximately→about`、`authorities→officials/police`、`casualties→the\
          \ dead and the injured`、`surge→jump/rise sharply`、`plummet→fall sharply`、`nevertheless→but/however`、`subsequently→later`、`prior\
          \ to→before`、`numerous→many`、`a majority of→most`。\\n- 被动改主动；定语从句拆成两句；每句\
          \ 15–25 词，超过 25 词必拆。\\n- 时态：主体一般过去时，引语内可用现在时或将来时。\\n- **不得虚构人名、地名、机构名、数字、引语或因果关系**——输入文本里没有的一律不写。\\\
          n- 每篇至少 1 个地名 + 1 个机构或人物名，数字 2–4 处，且全部取自输入文本。\\n- 体裁：这是开场篇，首句要直白、不铺背景、只放\
          \ 1 个关键细节，写 2 段。\\n\\n## 纯文本硬约束\\n\\n**允许**：英文字母、阿拉伯数字、半角 `,` `.` `?` `!`\
          \ `'` `-`、双引号（仅用于引语）、空格、换行。\\n\\n**禁止**：\\n\\n- 格局标记：`===`、`##`、`**`、行首\
          \ `-`、`1.` 序号\\n- 字段名：`SOURCE:` `TOPIC:` `WORD_COUNT:` `PASSAGE:` `SWAPS:`\
          \ `FLAG:` 等\\n- 括号 `()` `[]`、斜杠 `/`、和号 `&`、省略号 `...`、`!!` 这类连续标点\\n- 缩写形式（`won't`\
