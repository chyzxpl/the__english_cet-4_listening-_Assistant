          \ + 动作? （考方式、手段）\\n-  How many + 名词 + ...? （考数量，注意与近音数字混淆项配合）\\n-  How was\
          \ + 事件 + solved/handled? \\n-  How did + 人物 + feel + 情境? \\n\\n要点：抽中如何时，原文必须明确交代方式或数量，否则改为抽何事。\\\
          n\\n---\\n\\n## 何时 / 何地\\n\\n真题中何时仅出现 1 次、何地为 0 次，不要主动出这两类题。若确需考查时间或地点，应把时间/地点作为选项内容，而题干仍用何事或何人句。\"\
          }\n}else{\n    return{\"result\":\"# Q1-Q7 真题题干句式库（精简版）\\n\\n来源：2016–2024\
