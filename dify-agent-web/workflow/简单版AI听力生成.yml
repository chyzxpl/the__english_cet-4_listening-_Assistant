    - data:
        code: "\nfunction main({arg}) {\n    if(arg==1){\n        return{\"result\"\
          :\"# Q1 / Q2 真题题干句式库\\n\\n。\\n用法：优先套用真题原型改写（替换人名、地名、机构名、事件），不要自造句式。\\n改写时保留句式骨架，只替换实词。\\\
          n\\n---\\n\\n## 何事 · W1 事件经过型\\n\\n真题原型（Q1）：\\n\\n- What happened at a construction\
          \ site in Brooklyn on Tuesday?\\n- What happened in New York's Prospect\
          \ Park on Tuesday?\\n- What event will take place in Glasgow?\\n\\n真题原型（Q2）：\\\
          n\\n- What happened in Scotland last Wednesday?\\n- What finally happened\
          \ to the old man?\\n\\n通用模板：\\n\\n-  What happened to/on/in + 地点或人物 + 时间状语?\
          \ \\n-  What finally happened to + 人物/事物? \\n-  What will happen + when/if\
          \ + 条件? \\n-  What event will take place in + 地点? \\n\\n要点：答案是一个已发生或即将发生的事件，干扰项常为把事件的地点、时间、主体对调。\\\
          n\\n---\\n\\n## 何事 · W2 信息获知型\\n\\n真题原型（Q1）：\\n\\n- What is the news report\
          \ mainly about?\\n- What is reported in the news?\\n- What do we learn about\
          \ the new study from the news report?\\n- What do we learn from the news\
          \ report about the study?\\n- What do we learn from the police report?\\\
          n\\n真题原型（Q2）：\\n\\n- What do we learn from the report about tourism in France?\\\
          n- What do we learn about the cow from the end of the news report?\\n\\\
          n通用模板：\\n\\n-  What is the news report mainly about? （主旨题，答案应是对全篇的概括）\\\
          n-  What do we learn from the news report about + X? \\n-  What do we learn\
          \ about + X? \\n-  What is reported in the news? \\n\\n要点：W2 的正确项往往是概括或推断，不是原文某一句的直接复述。干扰项常为原文提到但只是细节、以偏概全。\\\
          n\\n---\\n\\n## 何事 · W3 行为举措型（占比最高）\\n\\n真题原型（Q1）：\\n\\n- What are scientists\
          \ planning to do?\\n- What were people in parts of Scotland advised to do?\\\
          n- What did Joe's parents decide to do?\\n- What did the old age pensioner\
          \ plan to do?\\n- What is the finding of the AAA survey?\\n- What problem\
          \ is Britain facing?\\n- What was the woman's problem?\\n\\n真题原型（Q2）：\\\
          n\\n- What does the report say about the snake?\\n- What did the head of\
          \ road policing urge drivers to do?\\n- What did the restaurant 'Number\
          \ 4'do?\\n- What is the scientists' recommendation?\\n- What does Glasgow\
          \ City Council say the event will do?\\n- What does the report say was still\
          \ unclear?\\n- What did the federal government do last month?\\n- What did\
          \ city officials of Fayetteville want bus drivers to be aware of?\\n\\n通用模板：\\\
          n\\n-  What did + 主体 + do/decide/attempt/try to do? \\n-  What is/are +\
          \ 主体 + planning/trying/aiming/hoping to do? \\n-  What were + 群体 + advised/required/urged/expected\
          \ to do? \\n-  What does the news report say about + X? \\n-  What is the\
          \ finding/problem/result/recommendation of + X? \\n-  What does + 机构 + say\
          \ + 事物 + will do? \\n\\n要点：答案是一个动作、举措、计划或研究结论。干扰项常为主体错位（把 A 的计划安到 B 头上）或程度偏移（计划说成已完成）。\\\
          n\\n---\\n\\n## 何因（Why / cause / purpose）\\n\\n真题原型（Q1）：\\n\\n- Why did\
          \ John Gordon move out of Abergeldie Castle?\\n- Why does New York State\
          \ want to turn off Niagara Falls?\\n- According to Google, what was the\
          \ cause of the accident?\\n- What accounts most for the huge declines in\
          \ tourism in France?\\n- What has caused the thick clouds in the photos\
          \ taken by NASA satellite?\\n- Why did the police officer stop the SUV car?\\\
          n- Why are families across the U.S. looking to this winter with fear?\\\
          n\\n真题原型（Q2）：\\n\\n- Why did Paula Pierce give Clint Buffington the reward?\\\
          n- Why did scientists choose to set up a 4G network in their mission?\\\
          n- What is the cause of the problem according to the UK Health Secretary?\\\
          n\\n通用模板：\\n\\n-  Why did/does + 主体 + 动作? \\n-  What is/was the cause of\
          \ + 事件 (+ according to + 来源)? \\n-  What caused / What has caused + 现象?\
          \ \\n-  What accounts for + 现象? \\n-  What is the purpose of + 事物?  /  For\
          \ what purpose did + 主体 + 动作? \\n-  What motivated + 人物 + to + 动作? \\n\\\
          n要点：答案必须是原文明确给出的原因；若原文只给结果未给原因，则不能出此类题。干扰项常为结果当原因。\\n\\n---\\n\\n## 何人（Who\
          \ / 某人说了什么 / 关于某人的信息）\\n\\n真题原型（Q1）：\\n\\n- What does the news report say\
          \ about the waiter?\\n- What do we learn about Sherry Christian?\\n- What\
          \ do we learn from the report about the 55-year-old woman?\\n\\n真题原型（Q2）：\\\
          n\\n- What does Juan Somavia, Director-General of the International Labour\
          \ Organization say?\\n- What did the spokesperson for United Airlines say\
          \ they would do after the incident?\\n- What did the researchers acknowledge?\\\
          n- What did the boy tell the police officers he was planning to do?\\n-\
          \ What do NASA officials think about the thick clouds?\\n- What did the\
          \ director of the city administration say at the end of the news report?\\\
          n\\n通用模板：\\n\\n-  What does/did + 人物（常带职务同位语）+ say (about + X)? \\n-  What\
          \ do we learn/know about + 人物 (+ from the news report)? \\n-  What does\
          \ the news report say about + 人物? \\n-  Who + 谓语动词 + ...? \\n\\n要点：Q2 的何人高频形态是转述某人的话或观点，正确项常含\
          \ say / think / acknowledge / believe 的 paraphrase。干扰项常为把甲的观点安给乙。\\n\\n---\\\
          n\\n## 如何（How）—— 本技能中极少出现，备用\\n\\n真题原型：\\n\\n- How did Kelly Swisher feel\
          \ when she first came across the rat snake?\\n- How was the woman's problem\
          \ eventually solved?\\n- How have Google's self-driving cars performed so\
          \ far?\\n\\n通用模板：\\n\\n-  How did + 主体 + 动作? \\n-  How was + 事件 + solved/handled?\
          \ \\n-  How did + 人物 + feel + 情境? \\n\\n---\\n\\n## 何时 / 何地\\n\\n真题中何时仅出现\
          \ 1 次、何地为 0 次，不要主动出这两类题。若确需考查时间或地点，应把时间/地点作为选项内容，而题干仍用何事或何因句式。\"}\n    }\n\
          else if(arg==2){\nreturn{\"result\":\"# Q5 / Q6 / Q7 真题题干句式库\\n\\n来源：2016–2024\
          \ 年英语四级听力 News Report 全部真题，224 题逐题归类后提取。\\n用法：优先套用真题原型改写（替换人名、地名、机构名、事件），不要自造句式。\\\
          n\\n---\\n\\n## 何事 · W1 事件经过型\\n\\n真题原型（Q5）：\\n\\n- What happened to the\
          \ tour boat sailing off the Nicaraguan coast?\\n- What happened to Scott\
          \ a month ago?\\n- What happened to the Philippine fisherman one day?\\\
          n- What happened on the streets of Blackhall Colliery?\\n\\n真题原型（Q7）：\\\
          n\\n- What happened to the little girl according to the news report?\\n-\
          \ What has happened at Frank's restaurant since the board of free meals\
